name: Short Uret

on:
  workflow_dispatch:
  schedule:
    # Uzun video saatlerinden (UTC 00,06,12,18) tam 1 saat once calisir: UTC 23,05,11,17
    - cron: '0 23,5,11,17 * * *'

permissions:
  contents: write

jobs:
  generate-short:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg ve font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: Siradaki Short konusunu kuyruktan bul
        id: pick
        run: |
          mkdir -p queue/shorts queue/shorts/done
          FILE=$(ls queue/shorts/*.json 2>/dev/null | sort | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Kuyrukta bekleyen Short konusu yok, bu sefer atlaniyor."
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "file=$FILE" >> $GITHUB_OUTPUT
            echo "Islenecek dosya: $FILE"
          fi

      - name: Short uret ve YouTube'a yukle
        if: steps.pick.outputs.found == 'true'
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python generate_video.py "${{ steps.pick.outputs.file }}"

      - name: Ciktilari yukle (indirilebilir dosya olarak)
        if: steps.pick.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short-ciktisi
          path: output/final_short.mp4

      - name: Islenen Short konusunu kuyruktan cikar
        if: steps.pick.outputs.found == 'true'
        run: |
          mv "${{ steps.pick.outputs.file }}" queue/shorts/done/
          git config user.name "video-otomasyon-bot"
          git config user.email "actions@github.com"
          git add queue/shorts/
          git commit -m "Short islendi: $(basename ${{ steps.pick.outputs.file }})"
          git checkout -- .
          git pull --rebase origin main
          git push
