name: UZUN OZEL BOLUM Uret (Elle Tetiklenir, 10-12 dk)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-long-special:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg ve font kur
        timeout-minutes: 5
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          echo 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "10";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::https::Timeout "10";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: Siradaki uzun ozel konuyu bul
        id: pick
        run: |
          mkdir -p queue/long_topics queue/long_topics/done
          FILE=$(ls queue/long_topics/*.json 2>/dev/null | sort | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Kuyrukta bekleyen uzun ozel konu yok."
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "file=$FILE" >> $GITHUB_OUTPUT
            echo "Islenecek dosya: $FILE"
          fi

      - name: Uzun ozel bolum uret ve YouTube'a yukle (skandal kanali)
        if: steps.pick.outputs.found == 'true'
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -u generate_long_video.py "${{ steps.pick.outputs.file }}"

      - name: Islenen konuyu kuyruktan cikar
        if: steps.pick.outputs.found == 'true'
        run: |
          mv "${{ steps.pick.outputs.file }}" queue/long_topics/done/
          git config user.name "video-otomasyon-bot"
          git config user.email "actions@github.com"
          git add queue/long_topics/
          git commit -m "Uzun ozel konu islendi: $(basename ${{ steps.pick.outputs.file }})"
          git checkout -- .
          git pull --rebase origin main
          git push
