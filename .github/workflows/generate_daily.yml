name: Gunluk Uretim (Video + Short)

on:
  workflow_dispatch:
  schedule:
    # Gunde 4 kez calisir (UTC 02,08,14,20 = Turkiye saatiyle 05:00,11:00,17:00,23:00)
    - cron: '0 2,8,14,20 * * *'

permissions:
  contents: write

jobs:
  generate-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg ve font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: Siradaki konuyu kuyruktan bul
        id: pick
        run: |
          mkdir -p queue/topics queue/topics/done
          FILE=$(ls queue/topics/*.json 2>/dev/null | sort | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Kuyrukta bekleyen konu yok, bu sefer atlaniyor."
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "file=$FILE" >> $GITHUB_OUTPUT
            echo "Islenecek dosya: $FILE"
          fi

      - name: Video + Short uret ve YouTube'a yukle
        if: steps.pick.outputs.found == 'true'
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -u generate_video.py "${{ steps.pick.outputs.file }}"

      - name: Ciktilari yukle (indirilebilir dosya olarak)
        if: steps.pick.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gunluk-ciktilar
          path: |
            output/final_video.mp4
            output/final_short.mp4
            output/thumbnail.jpg

      - name: Islenen konuyu kuyruktan cikar
        if: steps.pick.outputs.found == 'true'
        run: |
          mv "${{ steps.pick.outputs.file }}" queue/topics/done/
          git config user.name "video-otomasyon-bot"
          git config user.email "actions@github.com"
          git add queue/topics/
          git commit -m "Islendi: $(basename ${{ steps.pick.outputs.file }})"
          git checkout -- .
          git pull --rebase origin main
          git push
