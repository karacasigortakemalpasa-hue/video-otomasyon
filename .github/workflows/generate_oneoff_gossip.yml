name: Gossip Machine Uret (Tek Seferlik)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-gossip:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: Gorselleri uret ve birlestir
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python -u generate_oneoff_gossip.py gossip_scenes_all96.json

      - name: Ciktiyi yukle (indirilebilir dosya olarak)
        uses: actions/upload-artifact@v4
        with:
          name: gossip-machine-video
          path: output_gossip/final_gossip_video.mp4
