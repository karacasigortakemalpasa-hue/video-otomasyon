name: Iliski Kanali Uret (Yuklemesiz)

on:
  workflow_dispatch:
  schedule:
    # Gunde 4 kez calisir (UTC 01,07,13,19) - digger kanalin saatlerinden BILEREK farkli,
    # ayni queue/workflow dosyalarina hic dokunmuyor.
    - cron: '0 1,7,13,19 * * *'

permissions:
  contents: write

jobs:
  generate-relationship:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg ve font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: Siradaki iliski konusunu kuyruktan bul
        id: pick
        run: |
          mkdir -p queue/relationship_topics queue/relationship_topics/done
          FILE=$(ls queue/relationship_topics/*.json 2>/dev/null | sort | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Kuyrukta bekleyen iliski konusu yok, bu sefer atlaniyor."
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "file=$FILE" >> $GITHUB_OUTPUT
            echo "Islenecek dosya: $FILE"
          fi

      - name: Video + Short uret (YouTube'a YUKLEMEZ, sadece dosya)
        if: steps.pick.outputs.found == 'true'
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python -u generate_relationship_video.py "${{ steps.pick.outputs.file }}"

      - name: Ciktilari yukle (indirilebilir dosya olarak - SADECE burdan indirilir)
        if: steps.pick.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iliski-kanali-ciktilar
          path: |
            output/final_video.mp4
            output/final_short.mp4
            output/thumbnail.jpg

      - name: Islenen konuyu kuyruktan cikar
        if: steps.pick.outputs.found == 'true'
        run: |
          mv "${{ steps.pick.outputs.file }}" queue/relationship_topics/done/
          git config user.name "video-otomasyon-bot"
          git config user.email "actions@github.com"
          git add queue/relationship_topics/
          git commit -m "Iliski konusu islendi: $(basename ${{ steps.pick.outputs.file }})"
          git checkout -- .
          git pull --rebase origin main
          git push
