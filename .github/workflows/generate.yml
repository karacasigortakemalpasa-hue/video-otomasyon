name: Video Uret

on:
  workflow_dispatch:
  schedule:
    # Her gun Turkiye saatiyle 23:00 (UTC 20:00) calisir. Saati degistirmek icin
    # asagidaki '0 20 * * *' kismini duzenle (UTC saat * gun format).
    # Her 6 saatte bir (gunde 4 kez) calisir - kredinin 90 gunluk sure icinde dengeli tukenmesi icin.
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg ve font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: Siradaki konuyu kuyruktan bul
        id: pick
        run: |
          mkdir -p queue queue/done
          FILE=$(ls queue/*.json 2>/dev/null | sort | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Kuyrukta bekleyen konu yok, bugun uretim atlaniyor."
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "file=$FILE" >> $GITHUB_OUTPUT
            echo "Islenecek dosya: $FILE"
          fi

      - name: Video uret ve YouTube'a yukle
        if: steps.pick.outputs.found == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python generate_video.py "${{ steps.pick.outputs.file }}"

      - name: Ciktilari yukle (indirilebilir dosya olarak)
        if: steps.pick.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-ciktisi
          path: |
            output/final_video.mp4
            output/thumbnail.jpg

      - name: Islenen konuyu kuyruktan cikar
        if: steps.pick.outputs.found == 'true'
        run: |
          mv "${{ steps.pick.outputs.file }}" queue/done/
          git config user.name "video-otomasyon-bot"
          git config user.email "actions@github.com"
          git add queue/
          git commit -m "Islendi: $(basename ${{ steps.pick.outputs.file }})"
          git checkout -- .
          git pull --rebase origin main
          git push
